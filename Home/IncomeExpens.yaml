appId: com.it_twins.Piggy_gold
---
- launchApp
- tapOn:
    id: "IncomeExpense"
- assertVisible: "การเพิ่มรายการใหม่"
- tapOn:
    id: "Amount"
- inputText: "100"
- tapOn:
    id: "Description"
- inputText: "ค่าข้าว"  

- hideKeyboard 
- tapOn:
    id: "Save" 

- assertVisible: "-฿100"
- assertVisible: "ค่าข้าว"

- assertVisible: "Piggy Gold"
- tapOn: 
    id: "IncomeExpense"
- tapOn:
    id: "Income"
- tapOn:
    id: "Amount"
- inputText: "500"
- tapOn:
    id: "Description"
- inputText: "ได้เงิน"   
- hideKeyboard 
- tapOn:
    id: "Save"
- assertVisible: "+฿500"
- assertVisible: "ได้เงิน"
- assertVisible: "Piggy Gold"
- tapOn:
    id: "IncomeExpense"
- tapOn:
    id: "Back"
- assertVisible: "Piggy Gold"